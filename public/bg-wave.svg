<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 780" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D6EEFF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EBF5FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="wave1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5BB8F5;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#3A9CE8;stop-opacity:0.4" />
    </linearGradient>
    <linearGradient id="wave2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7ECBF7;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#5BB8F5;stop-opacity:0.25" />
    </linearGradient>
    <linearGradient id="wave3Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#A8DAFB;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#7ECBF7;stop-opacity:0.3" />
    </linearGradient>
    <linearGradient id="bottomWaveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5BB8F5;stop-opacity:0.35" />
      <stop offset="100%" style="stop-color:#A8DAFB;stop-opacity:0.2" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="480" height="780" fill="url(#bgGrad)"/>

  <!-- Top right arc (big bold curve) -->
  <path d="M 300 -60 Q 520 20 520 200 Q 520 320 380 260 Q 280 210 340 120 Q 380 60 300 -60 Z"
        fill="url(#wave1Grad)" />

  <!-- Top right secondary arc -->
  <path d="M 360 -80 Q 560 40 540 240 Q 530 320 440 290 Q 380 270 420 180 Q 450 110 360 -80 Z"
        fill="url(#wave2Grad)" />

  <!-- Upper wave band sweeping left to right -->
  <path d="M -20 160 Q 80 100 180 150 Q 280 200 380 140 Q 440 110 520 160 L 520 230 Q 440 190 360 230 Q 260 280 160 220 Q 60 160 -20 210 Z"
        fill="url(#wave3Grad)" />

  <!-- Mid wave band -->
  <path d="M -20 220 Q 80 170 200 210 Q 310 250 420 195 Q 470 170 520 200 L 520 260 Q 460 235 380 270 Q 260 320 140 270 Q 40 230 -20 265 Z"
        fill="url(#wave2Grad)" />

  <!-- Bottom left wave cluster -->
  <path d="M -20 640 Q 60 600 160 630 Q 250 658 340 615 Q 420 578 520 620 L 520 680 Q 420 645 340 680 Q 240 718 140 688 Q 50 660 -20 695 Z"
        fill="url(#bottomWaveGrad)" />

  <!-- Bottom secondary wave -->
  <path d="M -20 690 Q 70 658 170 680 Q 270 700 370 665 Q 450 640 520 668 L 520 720 Q 450 698 370 725 Q 260 758 150 730 Q 50 705 -20 730 Z"
        fill="url(#wave3Grad)" />

  <!-- Thin accent line top -->
  <path d="M -20 280 Q 100 240 220 270 Q 350 305 480 255 L 520 255 L 520 265 Q 480 265 380 315 Q 250 360 100 325 Q -10 300 -20 300 Z"
        fill="#FFFFFF" opacity="0.5" />
</svg>
